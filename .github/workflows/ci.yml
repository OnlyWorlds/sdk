name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  commits:
    # A commit message is published text too: the commits this push or pull request adds name no one
    # inside the team and point at no internal room or tracker, like the tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node scripts/public-words.mjs --commits "$RANGE"
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || (github.event.before && !startsWith(github.event.before, '0000000') && format('{0}..{1}', github.event.before, github.sha)) || github.sha }}

  build:
    # The build tool (tsup 9) runs only on Node 22.18 or later, while the package runs on Node 18 and
    # later. So the package is built once, here, on Node 22 as the release workflow builds it, and every
    # leg of the test matrix runs that one dist/: the artifact npm publishes, on each runtime it admits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    needs: build
    # ⚑ This job had NEVER passed. Ten runs, ten failures, from the day the "CI
    # gate" was added (2026-07-18) until 2026-07-28 — and nobody noticed,
    # because it fails identically every time and the failure was never opened.
    #
    # Cause: `npm test` was `node --test "test/**/*.test.mjs"`. Glob expansion in
    # the Node test runner landed in Node 22; this job pins Node 20, where the
    # quoted pattern is treated as a literal path and the run dies with
    # "Could not find '.../test/**/*.test.mjs'". It passed on every maintainer
    # machine (Node 22) and could not pass here. Confirmed by running the old
    # script under a real Node 20.18.1, not inferred.
    #
    # Fixed three ways, and the first two guesses were both wrong — the fix was
    # settled by running every candidate form on both versions:
    #   - `--test test` / `--test test/` passes on 20 and FAILS on 22 (22 tries
    #     to load the directory as a module). The exact inverse of the old bug.
    #   - `--test` with no args discovers correctly on both — but it also
    #     discovered `test-api-response.js`, a tracked v1-era scratch script in
    #     the repo root that matched Node's default `test-*.js` pattern, ran as
    #     a test, and failed. Removed: it spoke `/api/worldapi`, the dialect this
    #     package stopped supporting at 4.0.
    #   - The matrix below means a version-specific regression fails on the
    #     version it breaks, instead of hiding behind the one that works.
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # Published text names no one inside the team and points at no internal room or tracker.
      - run: node scripts/public-words.mjs
      # The build job's dist/, the same artifact npm publish ships. `npm test` would run pretest (the
      # tsup build) first, which the Node 18 and 20 legs cannot run, so the leg calls the runner itself:
      # `node --test`, the package's own test script.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Node 18 has Web Crypto as a global only behind a flag (it is one from Node 19 on), and
      # Sign in with OnlyWorlds needs it, so the 18 leg runs with the flag a Node 18 caller of the
      # sign-in would set. Without it the sign-in refuses by name: a test holds that on every leg.
      - run: node --test
        env:
          NODE_OPTIONS: ${{ matrix.node-version == 18 && '--experimental-global-webcrypto' || '' }}

  types:
    # The peer range (typescript >=4.5.0) is a promise to every TypeScript project, and the test job compiles
    # a consumer only with the TypeScript this repo installs. Here the same consumer is compiled against the
    # build's declarations by each version below, under each module resolution that version has. The first
    # entry is the range's floor (test/types-resolution.test.mjs holds it there); 7.0 is npm's latest.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        typescript: ['4.5', '4.7', '5.0', '6.0', '7.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npm install --prefix "$RUNNER_TEMP/ts" --no-save --no-audit --no-fund "typescript@${{ matrix.typescript }}"
      - run: node --test test/types-resolution.test.mjs
        env:
          OW_TSC_DIR: ${{ runner.temp }}/ts/node_modules/typescript
          OW_TSC_EXPECT: ${{ matrix.typescript }}

  live:
    # A few writes to the production practice world (its key and PIN published on the docs, reset
    # every night), each deleted again, through the built package. Red here with the test job green
    # means the server moved under the client, not that a change broke it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: node --test test/live-practice.test.mjs
        env:
          OW_LIVE: '1'

  wire:
    # The built package run against keel's public API document (/api/v2/openapi.json) through a recording
    # fetch: every route, parameter, header, body and answer type it uses is held to what the document
    # declares, and two checks ask production a few keyless reads. Keyless and public, so no secret. Exit 2
    # (the document could not be read) fails the job too: nothing was measured, which is not a pass.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: node scripts/verify-wire.mjs

  schema:
    # The schema guards. Before 2026-07-28 these could not run here at all:
    # codegen read a sibling checkout of the PRIVATE keel repo, which does not
    # exist on a runner. `codegen:check` existed as an npm script and had never
    # once fired in CI — a drift guard that was, in practice, a claim. The
    # repoint onto the vendored public distribution is what makes it real.
    #
    # Two checks, catching different things:
    #   schema:verify  — the vendored tree is the distribution we pinned
    #                    (contents vs MANIFEST, AND MANIFEST vs the hash
    #                    recorded at pin time — the moved-tag check)
    #   codegen:check  — the committed generated output matches that schema
    #
    # Neither implies the other. A correct pin with stale generated output
    # passes the first and fails the second; a regenerated file from a
    # substituted schema passes the second and fails the first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # PyYAML is codegen's only third-party dependency and this repo carries no
      # requirements.txt, so it is installed explicitly rather than implied.
      - run: pip install pyyaml
      - run: npm run schema:verify
      - run: npm run codegen:check
